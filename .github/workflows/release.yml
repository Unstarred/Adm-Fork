name: Release

on:
  push:
    branches: [main, "mc/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Odin 0.3.7 (26.3 port, not released yet)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - name: Version
        run: |
          echo "EC_VERSION=1.0.12" >> "$GITHUB_ENV"
          MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)
          echo "MC=$MC" >> "$GITHUB_ENV"
          echo "CHANNEL=$MC" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            .gradle
            build/kotlin
            build/classes
            build/tmp
          key: ec-compile-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: ec-compile-${{ github.ref_name }}-
      - run: gradle build -x test --console=plain -Dorg.gradle.jvmargs=-Xmx6G -Pkotlin.daemon.jvmargs=-Xmx6G
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "release-$CHANNEL" --yes --cleanup-tag || true
          if [ "$GITHUB_REF_NAME" = main ]; then latest=--latest; else latest=--latest=false; fi
          jar="ADM-$MC.jar"
          cp build/libs/*.jar "$jar"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/release-$CHANNEL/$jar"
          notes="$(printf '**[Download ADM for Minecraft %s](%s)** · %s\n\nPut the jar in your `mods` folder. Needs Fabric, Fabric API, Fabric Language Kotlin and Odin.' "$MC" "$url" "$EC_VERSION")"
          gh release create "release-$CHANNEL" "$jar" --target "$GITHUB_SHA" \
            --title "ADM for Minecraft $MC" \
            --notes "$notes" $latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
          cache-read-only: true
      - name: Odin 0.3.7 (26.3 port, not released yet)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - run: gradle test --console=plain -Dorg.gradle.jvmargs=-Xmx6G -Pkotlin.daemon.jvmargs=-Xmx6G
